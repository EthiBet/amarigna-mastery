<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>አማርኛ ማጥናት - Mastering Amharic</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Ethiopic:wght@400;700&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'Abyssinica SIL';
            src: local('Abyssinica SIL'), url('https://fonts.gstatic.com/s/abyssinicasil/v1/AbyssinicaSIL-Regular.ttf');
        }

        :root {
            --gold-primary: #D4AF37;
            --gold-light: #F9E29C;
            --gold-dark: #996515;
            --bg-overlay: rgba(10, 8, 0, 0.92);
            --text-light: #F9E29C;
            --card-bg: rgba(212, 175, 55, 0.1);
            --font-main: 'Abyssinica SIL', 'Noto Serif Ethiopic', serif;
            --error: #e74c3c;
            --success: #2ecc71;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: var(--font-main);
            color: var(--text-light);
            overflow: hidden;
            background-color: #000;
            background-size: cover;
            background-position: center;
        }

        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-overlay);
            display: flex; flex-direction: column; align-items: center;
            overflow-y: auto; padding: 40px 20px; box-sizing: border-box;
        }

        .container { width: 100%; max-width: 1000px; text-align: center; }
        .screen { display: none; width: 100%; }
        .active { display: block; }

        h1 { font-size: 4rem; color: var(--gold-primary); margin: 0; text-shadow: 0 0 20px rgba(212, 175, 55, 0.3); }
        .subtitle { font-size: 1.5rem; letter-spacing: 4px; color: white; margin-bottom: 40px; }

        /* Hierarchy Selection UI */
        .setup-container {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--gold-dark);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            text-align: left;
        }
        .pos-block { margin-bottom: 25px; }
        .pos-row { 
            display: flex; align-items: center; 
            font-size: 1.3rem; font-weight: bold; color: var(--gold-primary);
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            padding-bottom: 8px; margin-bottom: 12px;
        }
        .cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; padding-left: 30px; }
        .cat-item { display: flex; align-items: center; font-size: 1rem; cursor: pointer; color: #ccc; }
        .cat-item.active-text { color: var(--gold-light); }
        
        input[type="checkbox"] { transform: scale(1.3); margin-right: 12px; accent-color: var(--gold-primary); cursor: pointer; }

        .btn {
            background: linear-gradient(135deg, var(--gold-dark), var(--gold-primary));
            color: #000; font-weight: bold; border: none; padding: 15px 30px;
            margin: 10px; cursor: pointer; font-size: 1rem; border-radius: 50px;
            transition: 0.3s;
        }
        .btn:hover { transform: scale(1.05); box-shadow: 0 0 15px var(--gold-primary); }
        .btn-secondary { background: transparent; color: var(--gold-light); border: 1px solid var(--gold-primary); }

        /* Flashcard Slide Animation */
        .fc-stage { overflow: hidden; width: 360px; height: 460px; margin: 0 auto 20px; position: relative; }
        .card-container { 
            width: 100%; height: 100%; 
            perspective: 1000px;
            position: absolute;
            transition: transform 0.5s ease-out, opacity 0.5s;
        }
        .card-slide-in { animation: slideIn 0.5s forwards; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        .card { 
            width: 100%; height: 100%; position: relative; 
            transform-style: preserve-3d; transition: transform 0.6s; cursor: pointer; 
        }
        .card.flipped { transform: rotateY(180deg); }
        .card-face {
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: #111; border: 2px solid var(--gold-primary); border-radius: 25px; padding: 30px; box-sizing: border-box;
        }
        .card-back { transform: rotateY(180deg); border-color: var(--gold-light); }
        .main-txt { font-size: 3.5rem; color: var(--gold-light); text-align: center; }
        .sub-txt { font-size: 1.2rem; color: #777; margin-top: 15px; font-style: italic; }

        /* Matching Grid Visuals */
        .matching-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .match-card {
            background: rgba(255,255,255,0.05); padding: 25px; border-radius: 12px;
            border: 1px solid var(--gold-dark); cursor: pointer; transition: 0.3s; font-size: 1.3rem;
        }
        .match-card.selected { border-color: white; background: var(--gold-dark); color: #000; }
        .match-card.correct { background: var(--success) !important; color: white; border-color: #fff; box-shadow: 0 0 20px var(--success); }
        .match-card.wrong { background: var(--error) !important; color: white; border-color: #fff; box-shadow: 0 0 20px var(--error); }
        .match-card.hidden { opacity: 0; pointer-events: none; transform: scale(0.8); }

        select.mode-select {
            background: #222; color: var(--gold-light); border: 1px solid var(--gold-primary);
            padding: 10px 20px; border-radius: 10px; font-size: 1rem; margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div id="overlay">
    <div class="container">
        <div id="screen-welcome" class="screen active">
            <h1>አማርኛ ማጥናት</h1>
            <div class="subtitle">MASTERING AMHARIC</div>
            <button class="btn" onclick="showScreen('screen-setup')">ENTER STUDY HALL</button>
        </div>

        <div id="screen-setup" class="screen">
            <h2 style="color: var(--gold-primary)">Curate Your Vocabulary</h2>
            
            <div style="margin-bottom: 20px;">
                <label>Study Mode: </label>
                <select id="challenge-mode" class="mode-select">
                    <option value="eng-amh">English to Amharic</option>
                    <option value="amh-eng">Amharic to English</option>
                    <option value="random">Challenge (Both)</option>
                </select>
            </div>

            <div class="setup-container" id="selection-root">
                </div>

            <button class="btn" onclick="launch('flashcards')">FLASHCARDS</button>
            <button class="btn" onclick="launch('matching')">MATCHING</button>
            <button class="btn" onclick="launch('typing')">WRITING</button>
            <button class="btn btn-secondary" onclick="showScreen('screen-welcome')">BACK</button>
        </div>

        <div id="screen-flashcards" class="screen">
            <div class="fc-stage">
                <div id="fc-anchor"></div>
            </div>
            <p style="color: #666; margin-bottom: 20px;">Click card to translate</p>
            <button class="btn" onclick="nextFC()">NEXT CARD</button>
            <button class="btn btn-secondary" onclick="showScreen('screen-setup')">QUIT</button>
        </div>

        <div id="screen-matching" class="screen">
            <h2 style="color: var(--gold-primary)">Match the Pairs</h2>
            <div class="matching-grid" id="m-grid"></div>
            <button class="btn btn-secondary" onclick="showScreen('screen-setup')" style="margin-top:20px">QUIT</button>
        </div>

        <div id="screen-typing" class="screen">
            <h2 id="t-dir" style="color: var(--gold-primary)">Translate</h2>
            <div id="t-quest" style="font-size: 3.5rem; margin: 30px;"></div>
            <input type="text" id="t-input" placeholder="Type here..." 
                   style="background:rgba(0,0,0,0.5); border:2px solid var(--gold-primary); color:white; padding:15px; font-size:1.5rem; border-radius:10px; width:80%; text-align:center;">
            <div id="t-feedback" style="margin: 20px; font-size: 1.2rem; font-weight: bold;"></div>
            <button class="btn" onclick="checkType()">SUBMIT</button>
            <button class="btn btn-secondary" onclick="nextType()">SKIP</button>
        </div>
    </div>
</div>

        {id:170,pos:"Verb",cat:"Regular",amh:"ማጣት",trans:"maTat",eng:"to lose"},
        {id:171,pos:"Verb",cat:"Regular",amh:"ማፍቀር",trans:"mafqer",eng:"to love"}
    ];

    let state = {
        filtered: [],
        index: 0,
        mSelected: null,
        mLock: false
    };

    function init() {
        const root = document.getElementById('selection-root');
        const hierarchy = {};
        rawData.forEach(item => {
            if (!hierarchy[item.pos]) hierarchy[item.pos] = new Set();
            hierarchy[item.pos].add(item.cat);
        });

        Object.keys(hierarchy).sort().forEach(pos => {
            const block = document.createElement('div');
            block.className = 'pos-block';
            block.innerHTML = `
                <div class="pos-row">
                    <input type="checkbox" class="pos-chk" data-pos="${pos}" onchange="syncPos('${pos}', this.checked)">
                    ${pos}
                </div>
                <div class="cat-grid" id="grid-${pos}"></div>
            `;
            root.appendChild(block);

            const grid = block.querySelector('.cat-grid');
            Array.from(hierarchy[pos]).sort().forEach(cat => {
                const label = document.createElement('label');
                label.className = 'cat-item';
                label.innerHTML = `
                    <input type="checkbox" class="cat-chk" data-pos="${pos}" data-cat="${cat}" onchange="syncCat('${pos}')">
                    ${cat}
                `;
                grid.appendChild(label);
            });
        });
    }

    function syncPos(pos, isChecked) {
        document.querySelectorAll(`.cat-chk[data-pos="${pos}"]`).forEach(c => {
            c.checked = isChecked;
            c.parentElement.classList.toggle('active-text', isChecked);
        });
    }

    function syncCat(pos) {
        const cats = document.querySelectorAll(`.cat-chk[data-pos="${pos}"]`);
        const posBox = document.querySelector(`.pos-chk[data-pos="${pos}"]`);
        const anyChecked = Array.from(cats).some(c => c.checked);
        posBox.checked = anyChecked;
        cats.forEach(c => c.parentElement.classList.toggle('active-text', c.checked));
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function launch(mode) {
        const activeCats = Array.from(document.querySelectorAll('.cat-chk:checked')).map(c => c.dataset.cat);
        state.filtered = rawData.filter(i => activeCats.includes(i.cat)).sort(() => Math.random() - 0.5);
        
        if (state.filtered.length === 0) return alert("Please select categories first!");
        
        state.index = 0;
        showScreen(`screen-${mode}`);
        if (mode === 'flashcards') nextFC();
        if (mode === 'matching') nextMatch();
        if (mode === 'typing') nextType();
    }

    // FLASHCARD LOGIC
    function nextFC() {
        if (state.index >= state.filtered.length) state.index = 0;
        const item = state.filtered[state.index++];
        const mode = document.getElementById('challenge-mode').value;
        const anchor = document.getElementById('fc-anchor');
        
        // Clear old card for slide animation
        anchor.innerHTML = '';
        
        const container = document.createElement('div');
        container.className = 'card-container card-slide-in';
        
        // Determine Front vs Back based on user choice
        let isAmhFront = (mode === 'amh-eng') || (mode === 'random' && Math.random() > 0.5);
        
        container.innerHTML = `
            <div class="card" onclick="this.classList.toggle('flipped')">
                <div class="card-face card-front">
                    <div class="main-txt">${isAmhFront ? item.amh : item.eng}</div>
                    <div class="sub-txt">${isAmhFront ? item.trans : ""}</div>
                </div>
                <div class="card-face card-back">
                    <div class="main-txt">${isAmhFront ? item.eng : item.amh}</div>
                    <div class="sub-txt">${isAmhFront ? "" : item.trans}</div>
                </div>
            </div>
        `;
        anchor.appendChild(container);
    }

    // MATCHING LOGIC
    function nextMatch() {
        const grid = document.getElementById('m-grid');
        grid.innerHTML = '';
        const set = state.filtered.slice(0, 4);
        let cards = [];
        set.forEach(i => {
            cards.push({ id: i.id, text: i.amh, type: 'amh' });
            cards.push({ id: i.id, text: i.eng, type: 'eng' });
        });
        cards.sort(() => Math.random() - 0.5);

        cards.forEach(c => {
            const div = document.createElement('div');
            div.className = 'match-card';
            div.innerText = c.text;
            div.onclick = () => handleMatch(div, c);
            grid.appendChild(div);
        });
    }

    function handleMatch(div, data) {
        if (state.mLock || div.classList.contains('correct')) return;

        if (!state.mSelected) {
            state.mSelected = { div, data };
            div.classList.add('selected');
        } else {
            const first = state.mSelected;
            if (first.div === div) return;

            state.mLock = true;
            if (first.data.id === data.id && first.data.type !== data.type) {
                // SUCCESS
                div.classList.add('correct');
                first.div.classList.add('correct');
                setTimeout(() => {
                    div.classList.add('hidden');
                    first.div.classList.add('hidden');
                    state.mLock = false;
                }, 800);
            } else {
                // FAILURE
                div.classList.add('wrong');
                first.div.classList.add('wrong');
                setTimeout(() => {
                    div.classList.remove('wrong', 'selected');
                    first.div.classList.remove('wrong', 'selected');
                    state.mLock = false;
                }, 800);
            }
            state.mSelected = null;
        }
    }

    // TYPING LOGIC
    function nextType() {
        if (state.index >= state.filtered.length) state.index = 0;
        const item = state.filtered[state.index++];
        const mode = document.getElementById('challenge-mode').value;
        
        let isAmhQ = (mode === 'amh-eng') || (mode === 'random' && Math.random() > 0.5);
        
        document.getElementById('t-dir').innerText = isAmhQ ? "Translate to English" : "Translate to Amharic";
        document.getElementById('t-quest').innerText = isAmhQ ? item.amh : item.eng;
        state.target = isAmhQ ? item.eng : item.amh;
        
        document.getElementById('t-input').value = '';
        document.getElementById('t-feedback').innerText = '';
    }

    function checkType() {
        const input = document.getElementById('t-input').value.trim().toLowerCase();
        const target = state.target.toLowerCase();
        const fb = document.getElementById('t-feedback');

        if (input === target) {
            fb.style.color = "var(--success)";
            fb.innerText = "Correct!";
            setTimeout(nextType, 1000);
        } else {
            fb.style.color = "var(--error)";
            fb.innerText = `Wrong. Answer: ${state.target}`;
        }
    }

    init();
</script>
